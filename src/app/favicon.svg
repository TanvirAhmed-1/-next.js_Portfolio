<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container with rounded corners and border -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Code bracket accent < / > -->
  <path d="M12 28 L7 32 L12 36" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <path d="M52 28 L57 32 L52 36" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

  <!-- TA Monogram -->
  <text x="21" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="url(#primaryGrad)" filter="url(#glow)">T</text>
  <text x="35" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="url(#accentGrad)" filter="url(#glow)">A</text>

  <!-- Status dot -->
  <circle cx="50" cy="14" r="3" fill="#10b981" />
  <circle cx="50" cy="14" r="4.5" fill="none" stroke="#10b981" stroke-width="1" opacity="0.5" />
</svg>

