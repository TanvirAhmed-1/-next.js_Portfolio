<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="aGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Monogram Box -->
  <g transform="translate(10, 10)">
    <rect width="60" height="60" rx="16" fill="url(#logoBg)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
    <path d="M10 26 L5 30 L10 34" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
    <path d="M50 26 L55 30 L50 34" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
    <text x="18" y="41" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="url(#tGrad)">T</text>
    <text x="33" y="41" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="url(#aGrad)">A</text>
    <circle cx="48" cy="12" r="3" fill="#10b981" />
  </g>

  <!-- Typography -->
  <g transform="translate(85, 22)">
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
      Tanvir <tspan fill="url(#tGrad)">Ahmed</tspan>
    </text>
    <text x="0" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.5">
      FULL-STACK SOFTWARE ENGINEER
    </text>
  </g>
</svg>

